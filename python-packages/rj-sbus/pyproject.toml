[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rj-sbus"
version = "0.1.2"
description = "Ruijie RJ_SBUS driver (pyserial). Face Console map: logical 0/500/1000 → ticks -900/0/+900."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Face Console" }]
keywords = ["servo", "rj", "sbus", "ruijie", "serial"]
dependencies = ["pyserial>=3.5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]

[project.urls]
Documentation = "https://github.com/LUVIA-me/LuviaMini-Console"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rj_sbus = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "hardware: live serial tests (requires RJ servo; close Face Console port first)",
]
