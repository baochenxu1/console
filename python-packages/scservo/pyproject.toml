[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scservo"
version = "0.1.1"
description = "Feetech SC (scscl) bus servo Python API (pyserial). Safe window: center ±90°."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Face Console" }]
keywords = ["servo", "feetech", "sc", "scscl", "serial"]
dependencies = ["pyserial>=3.5"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scservo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
